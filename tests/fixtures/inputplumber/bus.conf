<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Private bus for tests: no service directories, so nothing can be activated. -->
<busconfig>
  <type>session</type>
  <!-- Required by dbus-daemon; tests always override it with a unique address. -->
  <listen>unix:abstract=omarchy-game-mode-test</listen>
  <keep_umask/>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
